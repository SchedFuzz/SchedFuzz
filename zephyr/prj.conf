# Zephyr schedfuzz config — qemu_cortex_m3 friendly.

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_PRINTK=y
CONFIG_LOG=n

CONFIG_MULTITHREADING=y
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_NUM_COOP_PRIORITIES=4
# Top 2 cooperative priorities (-4, -3) become meta-IRQ.
CONFIG_NUM_METAIRQ_PRIORITIES=2
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=10
CONFIG_TIMESLICE_PRIORITY=0

# Earliest-deadline-first tiebreak between same-priority threads.
CONFIG_SCHED_DEADLINE=y

CONFIG_USERSPACE=n
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_ANALYZER=n
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=y

CONFIG_ASSERT=y
CONFIG_ASSERT_ON_ERRORS=n
CONFIG_ASSERT_VERBOSE=y

CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
